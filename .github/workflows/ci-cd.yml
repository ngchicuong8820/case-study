name: Full DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          echo "✅ Build thành công môi trường E-commerce!"

  test:
    name: 🧪 Unit & Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          echo "✅ Pass: Chẩn đoán mạng (Network Test API)"
          echo "✅ Pass: Tải hóa đơn (Download API)"
          echo "✅ Pass: Sinh mã băm (Hash API)"
          echo "Tất cả Unit Test đều pass. Chuyển giao mã nguồn cho bộ phận Bảo mật (Sec)!"

  # ==========================================================
  # STAGE 2: CONTINUOUS SECURITY (DevSecOps Hard Gates)
  # ==========================================================
  secret-scanning:
    name: 🔐 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true 
      - name: Generate Summary & Enforce Gate
        run: |
          echo "### 🔐 Secret Scanning Report" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Target | Vulnerability | Severity | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | app.py | Hardcoded AWS Access Key | CRITICAL | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Secret Gate::Phát hiện Hardcoded AWS Key trong mã nguồn!"
          exit 1

  sca-analysis:
    name: 📦 Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Generate Vulnerable Dependency
        run: echo "urllib3==1.25.8" > requirements.txt 
      - name: SCA Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
      - name: Generate Summary & Enforce Gate
        run: |
          echo "### 📦 Dependency Security Report (SCA)" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Target | Vulnerability | Severity | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | requirements.txt | urllib3 (CVE-2020-26137) | HIGH | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=SCA Gate::Phát hiện thư viện chứa lỗ hổng!"
          exit 1

  sast-semgrep:
    name: ⚡ SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: "p/python p/security-audit p/flask"
      - name: Generate Summary & Enforce Gate
        run: |
          echo "### ⚡ Source Code Analysis (SAST)" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Target | Vulnerability | Severity | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | app.py | OS Command Injection | CRITICAL | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | app.py | Path Traversal | HIGH | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=SAST Gate::Phát hiện lỗ hổng tiêm mã nguy hiểm!"
          exit 1

  sast-codeql:
    name: 🧠 Deep SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:python"
      - name: Generate Summary & Enforce Gate
        run: |
          echo "### 🧠 Deep SAST Report (CodeQL)" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Target | Vulnerability | Severity | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | app.py | Weak Cryptography (MD5) | MEDIUM | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=CodeQL Gate::Luồng dữ liệu băm mật khẩu không an toàn!"
          exit 1

  quality-gate:
    name: 📊 Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ngchicuong8820_case-study
            -Dsonar.organization=ngchicuong8820
      - name: Generate Summary & Enforce Gate
        run: |
          echo "### 📊 Quality Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilities | 5 | 0 | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| Technical Debt | 2 days | 0 | FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Quality Gate::Nợ kỹ thuật và lỗ hổng vượt quá ngưỡng cho phép!"
          exit 1

  # ==========================================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================================
  container-security:
    name: 🐳 Build & Image Scan
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca-analysis, sast-semgrep, sast-codeql, quality-gate]
    steps:
      - run: echo "⛔ Sẽ không chạy tới đây do Hard Gate đã chặn!"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - run: echo "⛔ Triển khai thất bại! Lỗi bảo mật nghiêm trọng (Critical) chưa được vá."