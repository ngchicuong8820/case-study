name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write # Bổ sung dòng này để ZAP có quyền tạo báo cáo issue nếu cần

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd app
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Artifacts
        run: |
          echo "Building application packages..."
          python3 -m compileall app/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          echo "Executing unit tests..."
          python3 -c "print('All unit tests passed successfully!')"

  # --- 1.SEMGREP ---
  security-semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: '[Semgrep] Generate SARIF Report'
        run: |
          semgrep scan --config "p/python" app/ --sarif --output semgrep.sarif || true

      - name: '[Semgrep] Run Scan & Enforce Gate (Block Pipeline)'
        run: |
          # Chỉ quét thư mục app/ với các quy tắc python để tránh bị nhiễu log và dễ lấy minh chứng
          semgrep scan --config "p/python" app/ --severity ERROR --severity WARNING --error

      - name: '[Semgrep] Upload SARIF Report'
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # --- 2.GITHUB CODEQL ---
  security-codeql:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: '[CodeQL] Initialize Engine'
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: '[CodeQL] Perform Deep Analysis'
        uses: github/codeql-action/analyze@v3

  # --- 3.SONARQUBE (SONARCLOUD) ---
  security-sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ngchicuong8820
            -Dsonar.projectKey=ngchicuong8820_case-study

  # --- 4. TRIVY FILESYSTEM & SECRETS SCAN ---
  security-trivy-fs:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy FS scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

  # --- 5. TRIVY CONTAINER IMAGE SCAN ---
  security-trivy-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build an image from Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: my-python-app:${{ github.sha }}

      - name: Run Trivy vulnerability scanner for image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'my-python-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  # --- 7. INFRASTRUCTURE AS CODE (IaC) SCANNING ---
  security-iac-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy IaC scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'

  deploy_mock:
    runs-on: ubuntu-latest
    needs: [security-semgrep, security-codeql, security-sonar, security-trivy-fs, security-trivy-image, security-docker-compose, security-iac-scan]
    steps:
      - name: Mock Deployment Execution
        run: |
          echo "=================================================="
          echo "All Security & Quality Gates Passed Successfully!"
          echo "Deploying application to Mock Environment..."
          echo "Status: ONLINE"
          echo "=================================================="