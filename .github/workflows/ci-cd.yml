name: Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # --- 1. BUILD ---
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          cd app
          touch requirements.txt 
          pip install -r requirements.txt
          python3 -m compileall .
          echo "Build completed!"

  # --- 2. TEST ---
  test:
    runs-on: ubuntu-latest
    needs: build  # Nhánh Test chạy sau khi Build thành công
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Executing unit tests... Passed!"

  # --- 3. SEMGREP (SAST) ---
  security-semgrep:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep Scan
        run: |
          semgrep scan --config=auto app/ --error

  # --- 4. CODEQL (DEEP SAST) ---
  security-codeql:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  # --- 5. SONARCLOUD (CODE QUALITY & SAST) ---
  security-sonar:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan & Enforce Quality Gate
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ngchicuong8820
            -Dsonar.projectKey=ngchicuong8820_case-study
            -Dsonar.qualitygate.wait=true

  # --- 6. TRIVY FILESYSTEM (SECRETS & DEPENDENCIES) ---
  security-trivy-fs:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    steps:
      - uses: actions/checkout@v4
      - name: '[Trivy] Run Filesystem Scan'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  # --- 7. TRIVY CONTAINER IMAGE SCAN ---
  security-trivy-image:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: my-python-app:latest
      - name: '[Trivy] Run Container Image Scan'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'my-python-app:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  # --- 8. TRIVY IaC SCAN ---
  security-iac-scan:
    runs-on: ubuntu-latest
    needs: test  # Đợi Test xong mới chạy quét bảo mật
    steps:
      - uses: actions/checkout@v4
      - name: '[Trivy] Run IaC Misconfiguration Scan'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

  # --- 9. DEPLOY MOCK (GATEKEEPER) ---
  deploy_mock:
    runs-on: ubuntu-latest
    needs: [test, security-semgrep, security-codeql, security-sonar, security-trivy-fs, security-trivy-image, security-iac-scan]
    steps:
      - name: Mock Deployment Execution
        run: |
          echo "=================================================="
          echo "✅ All Security & Quality Gates Passed Successfully!"
          echo "🚀 Deploying application to Mock Environment..."
          echo "🟢 Status: ONLINE"
          echo "=================================================="