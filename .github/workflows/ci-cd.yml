name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd app
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Artifacts
        run: |
          echo "Building application packages..."
          python3 -m compileall app/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          echo "Executing unit tests..."
          python3 -c "print('All unit tests passed successfully!')"

  # --- 1.SEMGREP ---
  security-semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: '[Semgrep] Generate SARIF Report'
        run: |
          semgrep scan --config=auto --sarif --output semgrep.sarif || true

      - name: '[Semgrep] Run Scan & Enforce Gate (Block Pipeline)'
        run: |
          semgrep scan --config=auto --severity ERROR --error

      - name: '[Semgrep] Upload SARIF Report'
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # --- 2.GITHUB CODEQL ---
  security-codeql:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: '[CodeQL] Initialize Engine'
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: '[CodeQL] Perform Deep Analysis'
        uses: github/codeql-action/analyze@v3

  # --- 3.SONARQUBE (SONARCLOUD) ---
  security-sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ngchicuong8820
            -Dsonar.projectKey=ngchicuong8820_case-study

  # --- 4. TRIVY (FS & IMAGE) ---
  security-trivy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Quét Filesystem (có thể sẽ fail và dừng lại nếu không có if: always ở các bước sau)
      - name: '[Trivy] Run Filesystem Scan'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 2. Thiết lập Docker (Thêm if: always() để chạy bất chấp bước FS fail)
      - name: Set up Docker Buildx
        if: always()
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker Image
      - name: Build Docker Image for Scanning
        if: always()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: my-python-app:latest

      # 4. Quét Container Image
      - name: '[Trivy] Run Container Image Scan'
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-python-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy_mock:
    runs-on: ubuntu-latest
    needs: [security-semgrep, security-codeql, security-sonar, security-trivy]
    steps:
      - name: Mock Deployment Execution
        run: |
          echo "=================================================="
          echo "All Security & Quality Gates Passed Successfully!"
          echo "Deploying application to Mock Environment..."
          echo "Status: ONLINE"
          echo "=================================================="